name: SentinelFlow CI

on:
  push:
#empty for now
  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinelflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-static:
    name: Unit + static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            api/requirements.txt
            agent/requirements.txt
            event-writer/requirements.txt

      - name: Install test and application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r api/requirements.txt -r agent/requirements.txt -r event-writer/requirements.txt

      - name: Compile all Docker-project Python
        run: |
          python -m compileall -q agent api event-writer simulator spark tests

      - name: Lint for real Python errors
        run: |
          ruff check --select E9,F63,F7,F82 agent api event-writer simulator spark tests

      - name: Validate Cassandra init shell
        run: bash -n cassandra/init.sh

      - name: Validate Docker Compose
        run: docker compose config -q

      - name: Run unit tests
        run: |
          pytest -vv -s --durations=20

  docker-e2e:
    name: Docker Compose E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: unit-and-static
    env:
    #replace this so that the agent uses prompts and not just regression
      OPENAI_API_KEY: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Compose before startup
        run: docker compose config -q

      - name: Build project images
        run: docker compose build --pull

      - name: Start complete Docker stack
        run:  docker compose up -d

      - name: Wait for REST API
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 5
          done
          echo "API did not become healthy" >&2
          exit 1

      - name: Verify Kafka cluster and topics
        run: |
          docker compose exec -T kafka-1 /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka-1:19092 --describe --topic security-events | tee /tmp/security-events.txt
          grep -q 'PartitionCount: 6' /tmp/security-events.txt
          grep -q 'ReplicationFactor: 3' /tmp/security-events.txt
          for topic in security-alerts agent-actions; do
            docker compose exec -T kafka-1 /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server kafka-1:19092 --describe --topic "$topic" | tee "/tmp/$topic.txt"
            grep -q 'ReplicationFactor: 3' "/tmp/$topic.txt"
          done

      - name: Verify Cassandra cluster and schema
        run: |
          docker compose exec -T cassandra-1 nodetool status | tee /tmp/nodetool.txt
          test "$(awk '/^UN/{count++} END{print count+0}' /tmp/nodetool.txt)" -eq 3
          docker compose exec -T cassandra-1 cqlsh -e \
            "SELECT table_name FROM system_schema.tables WHERE keyspace_name='sentinelflow';" | tee /tmp/schema.txt
          for table in events_by_user_day events_by_ip_day events_by_device_day alerts_by_user investigations_by_incident investigations_by_user; do
            grep -q "$table" /tmp/schema.txt
          done

      - name: Verify Spark services are alive
        run: |
          docker compose ps --status running spark-master spark-worker-1 spark-worker-2 spark-job
          test "$(docker compose ps --status running -q spark-master spark-worker-1 spark-worker-2 spark-job | wc -l)" -eq 4
          # Give the streaming query time to attach to Kafka before injecting the scenario.
          sleep 25

      - name: Inject attack scenario
        run: docker compose --profile demo run --rm simulator python simulator.py attack

      - name: Verify end-to-end investigation
        run: python tests/integration/wait_for_investigation.py

      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color --tail=250 kafka-init cassandra-init event-writer spark-job api agent || true
      - name: Cassandra 2 diagnostics
        if: failure()
        run: |
          echo "===== CASSANDRA 2 LOG ====="
          docker compose logs --no-color --tail=300 cassandra-2 || true

          echo "===== CONTAINER STATE ====="
          docker inspect sentinelflow-cassandra-2 \
            --format='ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} Error={{.State.Error}}' \
            || true
      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans