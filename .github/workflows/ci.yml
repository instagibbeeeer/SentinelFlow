name: SentinelFlow CI

on:
  push:

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinelflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-static:
    name: Unit + static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            agent/requirements.txt
            event-writer/requirements.txt

      - name: Install test and application dependencies
        run: |
          python -m pip install --upgrade pip
          
          pip install -r api/requirements.txt -r agent/requirements.txt -r event-writer/requirements.txt

      - name: Compile all Docker-project Python
        run: |
          python -m compileall -q agent api event-writer simulator spark tests

      - name: Lint for real Python errors
        run: |
          ruff check --select E9,F63,F7,F82 agent api event-writer simulator spark tests

      - name: Validate Cassandra init shell
        run: bash -n cassandra/init.sh

      - name: Validate Docker Compose
        run: docker compose config -q

      - name: Unit tests + coverage
        run: |
          pytest -q \
            --cov=agent \
            --cov=api \
            --cov=event-writer \
            --cov=simulator \
            --cov=spark \
            --cov-report=term-missing \
            --cov-fail-under=65

  