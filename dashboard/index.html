<!doctype html><html><head><meta charset="utf-8"><title>SentinelFlow</title>
<style>body{font:16px system-ui;max-width:900px;margin:40px auto;padding:0 16px;background:#111;color:#eee}input,button{font:inherit;padding:8px}pre{background:#1d1d1d;padding:16px;overflow:auto;border-radius:8px}.muted{color:#aaa}</style></head>
<body><h1>SentinelFlow</h1><p class="muted">Minimal GraphQL investigation console</p>
<input id="user" value="user-07"><button onclick="run()">Load user timeline</button><pre id="out">Ready.</pre>
<script>async function run(){let u=document.getElementById('user').value;let q=`query($u:String!){eventsByUser(userId:$u,limit:50){eventTime eventType ip deviceId country bytes} investigationsByUser(userId:$u,limit:10){createdAt severity confidence conclusion evidence recommendedActions agentMode}}`;let r=await fetch(`http://${location.hostname}:8000/graphql`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:q,variables:{u}})});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
