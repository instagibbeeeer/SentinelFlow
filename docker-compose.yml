services:
  kafka-1:
    image: apache/kafka:4.3.1
    hostname: kafka-1
    container_name: sentinelflow-kafka-1
    ports:
      - "9092:9092"
    environment: &kafka-common
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:19092,PLAINTEXT_HOST://localhost:9092
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30

  kafka-2:
    image: apache/kafka:4.3.1
    hostname: kafka-2
    container_name: sentinelflow-kafka-2
    ports:
      - "9093:9092"
    environment:
      <<: *kafka-common
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:19092,PLAINTEXT_HOST://localhost:9093
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30

  kafka-3:
    image: apache/kafka:4.3.1
    hostname: kafka-3
    container_name: sentinelflow-kafka-3
    ports:
      - "9094:9092"
    environment:
      <<: *kafka-common
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:19092,PLAINTEXT_HOST://localhost:9094
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: >
      '/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:19092 --create --if-not-exists --topic security-events --partitions 6 --replication-factor 3 &&
       /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:19092 --create --if-not-exists --topic security-alerts --partitions 3 --replication-factor 3 &&
       /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:19092 --create --if-not-exists --topic agent-actions --partitions 3 --replication-factor 3'

  cassandra-1:
    image: cassandra:5.0.9
    hostname: cassandra-1
    container_name: sentinelflow-cassandra-1
    environment:
      CASSANDRA_CLUSTER_NAME: SentinelFlow
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_SEEDS: cassandra-1
      MAX_HEAP_SIZE: 768M
      HEAP_NEWSIZE: 256M
    ports:
      - "9042:9042"
    volumes:
      - cassandra1_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE CLUSTER' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 30

  cassandra-2:
    image: cassandra:5.0.9
    hostname: cassandra-2
    container_name: sentinelflow-cassandra-2
    depends_on:
      cassandra-1:
        condition: service_healthy
    environment:
      CASSANDRA_CLUSTER_NAME: SentinelFlow
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_SEEDS: cassandra-1
      MAX_HEAP_SIZE: 768M
      HEAP_NEWSIZE: 256M
    volumes:
      - cassandra2_data:/var/lib/cassandra

  cassandra-3:
    image: cassandra:5.0.9
    hostname: cassandra-3
    container_name: sentinelflow-cassandra-3
    depends_on:
      cassandra-1:
        condition: service_healthy
    environment:
      CASSANDRA_CLUSTER_NAME: SentinelFlow
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_SEEDS: cassandra-1
      MAX_HEAP_SIZE: 768M
      HEAP_NEWSIZE: 256M
    volumes:
      - cassandra3_data:/var/lib/cassandra

  cassandra-init:
    image: cassandra:5.0.9
    depends_on:
      cassandra-1:
        condition: service_healthy
      cassandra-2:
        condition: service_started
      cassandra-3:
        condition: service_started
    volumes:
      - ./cassandra/schema.cql:/schema.cql:ro
      - ./cassandra/init.sh:/init.sh:ro
    entrypoint: ["/bin/bash", "/init.sh"]

  event-writer:
    build: ./event-writer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      cassandra-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      CASSANDRA_HOSTS: cassandra-1,cassandra-2,cassandra-3
    restart: unless-stopped

  spark-master:
    image: apache/spark:4.2.0
    hostname: spark-master
    container_name: sentinelflow-spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports:
      - "8080:8080"
      - "7077:7077"

  spark-worker-1:
    image: apache/spark:4.2.0
    depends_on: [spark-master]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: 1
      SPARK_WORKER_MEMORY: 1g

  spark-worker-2:
    image: apache/spark:4.2.0
    depends_on: [spark-master]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: 1
      SPARK_WORKER_MEMORY: 1g

  spark-job:
    build: ./spark
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
    volumes:
      - ./spark:/opt/sentinelflow/spark:ro
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.2.0
      - /opt/sentinelflow/spark/streaming_alerts.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      PYSPARK_PYTHON: python3
    restart: unless-stopped

  api:
    build: ./api
    depends_on:
      cassandra-init:
        condition: service_completed_successfully
    environment:
      CASSANDRA_HOSTS: cassandra-1,cassandra-2,cassandra-3
    ports:
      - "8000:8000"
    restart: unless-stopped

  agent:
    build: ./agent
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      api:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      GRAPHQL_URL: http://api:8000/graphql
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5}
    restart: unless-stopped

  simulator:
    build: ./simulator
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      EVENTS_PER_SECOND: 5
    profiles: ["demo"]

volumes:
  cassandra1_data:
  cassandra2_data:
  cassandra3_data:
